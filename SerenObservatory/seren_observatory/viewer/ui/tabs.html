<!-- Two-panel glance on the shell contract (class="tab" data-tab=<id>); the
     shell styles + auto-activates the first, and the click routes through the
     shell's showTab (the shell wires no click of its own). Panels are .view
     sections in body.html with matching ids. -->
<button class="tab" data-tab="system" onclick="showTab('system')">System</button>
<button class="tab" data-tab="services" onclick="showTab('services')">Services</button>
